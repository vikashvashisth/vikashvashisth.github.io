<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" viewBox="0 0 1000 290" role="img" aria-label="General coupling loop: Fluent state to Drude properties to HFSS fields to verification to returned heating, then back to Fluent"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#176c7c"/></marker></defs><g fill="none" stroke="#176c7c" stroke-width="2" marker-end="url(#a)"><path d="M280 65 H360"/><path d="M640 65 H720"/><path d="M850 112 V174"/><path d="M720 222 H460"/><path d="M180 222 H130 V112"/></g><g fill="#eef5f6" stroke="#cbdde2"><rect x="0" y="15" width="280" height="97" rx="5"/><rect x="360" y="15" width="280" height="97" rx="5"/><rect x="720" y="15" width="280" height="97" rx="5"/><rect x="720" y="174" width="280" height="97" rx="5"/><rect x="180" y="174" width="280" height="97" rx="5"/></g><g fill="#142f40" font-size="18" font-weight="600" text-anchor="middle"><text x="140" y="53">Fluent plasma state</text><text x="500" y="53">Drude material properties</text><text x="860" y="53">HFSS electromagnetic fields</text><text x="860" y="212">Verification checks</text><text x="320" y="212">Returned heating</text></g><g fill="#536774" font-size="14" text-anchor="middle"><text x="140" y="82">Temperature, species, electron density</text><text x="500" y="82">Complex relative permittivity</text><text x="860" y="82">Fields and power deposition</text><text x="860" y="242">Material representation and losses</text><text x="320" y="242">Volumetric source for Fluent</text><text x="590" y="210">Accept before transfer</text></g></svg>
